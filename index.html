<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vérification des montures — Enclave</title>
  <style>
    body { font-family: system-ui, Arial; padding: 20px; background:#f6f7fb; color:#111; }
    h1 { margin-bottom: 6px; }
    p.lead { margin-top:0; color:#444 }

    table { width:100%; border-collapse: collapse; margin-top:12px; background:#fff; border-radius:8px; overflow:hidden; }
    thead th { background:linear-gradient(180deg,#f3f4f8,#eef0f6); padding:10px; text-align:center; font-weight:600; border-bottom:1px solid #e6e9f0; }
    tbody td { padding:8px; border-bottom:1px solid #f2f4fa; text-align:center; vertical-align:middle; }
    tbody tr:first-child td { border-top: none; }

    td.character { text-align:left; font-weight:600; padding-left:12px; width:240px; }
    .mount-col { width:120px; }
    .mount-thumb { width:80px; height:50px; object-fit:cover; border-radius:6px; display:block; margin:6px auto; background:#eee }
    .small { font-size:0.85rem; color:#555 }

    .icon { width:20px; height:20px; display:inline-block; vertical-align:middle }
    .ok { color: #1f9d55; }
    .no { color: #d64550; }

    #loader { margin:12px 0; }
    .muted { color:#666; font-size:0.9rem }
    .error { color:crimson }

    /* Responsive: make table horizontally scrollable on small screens */
    .table-wrap { overflow:auto; border-radius:8px; }
  </style>
</head>
<body>
  <p class="lead"></p>
  <div id="loader"></div>
  <h1>Montures de Défi Dawntrail</h1>
  <div style="margin:8px 0">
    <button id="startBtn">Lancer recherche</button>
    <span class="muted"></span>
  </div>

  <div class="table-wrap">
    <table id="resultTable" aria-live="polite">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // --- CONFIGURATION : remplace ces listes par les 8 montures et les 8 personnages réels ---
    // Montures : identifiants (ou slugs) tels qu'utilisés par l'API FFXIVCollect
    const mountsList = [
      "345",
      "346",
      "363",
      "389",
      "407",
      "422",
      "444",
      "420"
    ];

    // Personnages : fournissez au minimum { name, id } où id est l'identifiant numérique du personnage
    const charactersList = [
      { name: "Ephrael", id: "26350880" },
      { name: "Ladon", id: "26361333" },
      { name: "Laphos", id: "31623351" },
      { name: "Lord", id: "47199330" },
      { name: "Ruuj", id: "26167752" },
      { name: "Seekoya", id: "40801600" },
      { name: "Seika", id: "40634418" }
    ];

    // --- Helpers ---
    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    async function fetchMount(idOrSlug){
      const apiUrl = `https://ffxivcollect.com/api/mounts/${encodeURIComponent(idOrSlug)}?language=fr`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error(`mount ${idOrSlug} -> HTTP ${res.status}`);
      return await res.json();
    }

    // New: fetch owned mounts for a character using the dedicated endpoint
    async function fetchCharacterOwnedMountIds(characterId){
      const apiUrl = `https://ffxivcollect.com/api/characters/${encodeURIComponent(characterId)}/mounts/owned`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error(`owned mounts ${characterId} -> HTTP ${res.status}`);
      const data = await res.json();
      // Expecting an array of objects with an `id` field
      if (!Array.isArray(data)) return [];
      return data.map(item => String(item.id));
    }

    // SVG icons
    const SVG_OK = '<svg class="icon ok" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" [...]'
    const SVG_NO = '<svg class="icon no" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="ro[...]'

    // --- Rendering ---
    function buildHeader(mounts){
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '';
      const tr = document.createElement('tr');
      tr.innerHTML = '<th></th>' + mounts.map(m=>`<th class="mount-col"><img class="mount-thumb" src="${escapeHtml(m.image||m.image_url||m.icon||'')}" alt="${escapeHtml(m.name||m.title||'')}"><di[...]`).join('')
      thead.appendChild(tr);
    }

    function buildRow(character, ownedSet){
      const tr = document.createElement('tr');
      const first = document.createElement('td');
      first.className = 'character';
      first.textContent = character.name || character.id || '—';
      tr.appendChild(first);

      for (const mId of mountsList){
        const td = document.createElement('td');
        td.setAttribute('data-mount', mId);
        const has = ownedSet.has(String(mId));
        td.innerHTML = has ? `${SVG_OK}` : `${SVG_NO}`;
        td.title = has ? 'Possédé' : 'Non possédé';
        tr.appendChild(td);
      }
      return tr;
    }

    // Main flow when user clicks
    document.getElementById('startBtn').addEventListener('click', async ()=>{
      const loader = document.getElementById('loader');
      loader.textContent = 'Chargement des données des montures…';
      const gridHead = document.getElementById('tableHead');
      const gridBody = document.getElementById('tableBody');
      gridHead.innerHTML = '';
      gridBody.innerHTML = '';

      try{
        // 1) Récupère les informations des montures (image + nom) en parallèle
        const mountPromises = mountsList.map(id => fetchMount(id).then(d=>({ok:true,d})).catch(e=>({ok:false,e}))); 
        const mountsResults = await Promise.all(mountPromises);
        const mounts = mountsResults.map((r, idx)=> r.ok ? r.d : { id: mountsList[idx], name: mountsList[idx], image: '' });

        buildHeader(mounts);
        loader.textContent = 'Vérification des personnages (récupération des collections owned)...';

        // 2) Pour chaque personnage, affiche placeholder
        for (const ch of charactersList){
          const rowPlaceholder = document.createElement('tr');
          rowPlaceholder.innerHTML = `<td class="character">${escapeHtml(ch.name||ch.id)}</td><td colspan="${mountsList.length}" class="muted">Chargement...</td>`;
          gridBody.appendChild(rowPlaceholder);
        }

        // Fetch owned mounts for all characters in parallel
        const characterPromises = charactersList.map(c => fetchCharacterOwnedMountIds(c.id).then(ids=>({ok:true,ids,c})).catch(e=>({ok:false,e,c})));
        const charactersResults = await Promise.all(characterPromises);

        // Clear body and append final rows
        gridBody.innerHTML = '';
        for (const res of charactersResults){
          if (res.ok){
            const ownedSet = new Set(res.ids.map(x=>String(x)));
            const tr = buildRow(res.c, ownedSet);
            gridBody.appendChild(tr);
          } else {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="character">${escapeHtml(res.c.name||res.c.id)}</td><td colspan="${mountsList.length}" class="error">Erreur: ${escapeHtml(String(res.e))}</td>`;
            gridBody.appendChild(tr);
          }
        }

       // loader.textContent = 'Vérification terminée.';
      }catch(err){
        loader.innerHTML = `<span class="error">Erreur inattendue: ${escapeHtml(String(err))}</span>`;
        console.error(err);
      }

      });

    // Auto-start la recherche au chargement de la page (équivalent d'appuyer sur le bouton)
    document.addEventListener('DOMContentLoaded', function(){
      const btn = document.getElementById('startBtn');
      if (btn) btn.click();
    });

  </script>
</body>
</html>
