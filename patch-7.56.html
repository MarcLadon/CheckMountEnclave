<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patch 7.56 — Enclave</title>
  <style>
    body { font-family: system-ui, Arial; padding: 20px; background:#f6f7fb; color:#111; }
    header.site-nav { display:flex; align-items:center; margin-bottom:16px; }
    nav.primary { display:flex; gap:8px; }
    nav.primary a { text-decoration:none; color:#111; padding:8px 12px; border-radius:6px; font-weight:600 }
    nav.primary a.active { background:#1f9d55; color:#fff; }
    nav.primary a:hover { background:#eef6f0; }
    .content { background:#fff; border-radius:8px; padding:16px; }

    .category { margin:16px 0; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { padding:8px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle }
    th { background:#f3f4f8; font-weight:600 }
    td.image-cell img { width:80px; height:48px; object-fit:cover; border-radius:6px; background:#f0f0f0 }
    td.method, td.sources, td.description { color:#444 }

    .muted { color:#666; font-size:0.95rem }
    .status-yes { color:#1f9d55; font-weight:700 }
    .status-no { color:#d64550; font-weight:700 }
    .status-unk { color:#666 }

    .note { font-size:0.95rem; color:#444; margin-bottom:12px }

    .filter-controls { margin: 16px 0; padding: 12px; background: #f9f9f9; border-radius: 6px; }
    .filter-group { display: flex; gap: 12px; align-items: center; }
    .filter-group label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem; margin: 0; }

    /* Toggle Switch Styles */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1f9d55;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .category.hidden { display: none; }
    .category tbody tr.hidden { display: none; }

    .progress-text { color: #666;  }
    .progress-text.complete { color: #1f9d55; font-weight: 700; }
  </style>
</head>
<body>
  <header class="site-nav" role="banner">
    <nav class="primary" aria-label="Navigation principale">
      <a href="index.html" class="nav-link" data-page="index">Accueil</a>
      <a href="patch-7.56.html" class="nav-link" data-page="patch-7.56">Patch 7.56</a>
    </nav>
  </header>

  <main class="content">
    <h1>Patch 7.56</h1>
    
    <div class="filter-controls">
      <div class="filter-group">
        <label for="owned-filter">
          <span>Afficher/Cacher les éléments possédés</span>
          <div class="toggle-switch">
            <input type="checkbox" id="owned-filter" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </div>
   
    <div id="categories"></div>

    <p>Retour : <a href="index.html">Accueil</a></p>
  </main>

  <script>
    // Activate nav link for current page
    (function(){
      try{
        const path = location.pathname.split('/').pop();
        const page = path === '' ? 'index.html' : path;
        document.querySelectorAll('.nav-link').forEach(a=>{
          const href = a.getAttribute('href');
          if (href === page || (href === 'patch-7.56.html' && page === 'patch-7.56.html')) a.classList.add('active');
        });
      }catch(e){/* ignore */}
    })();
  </script>

  <script>
    (function(){
      const CHAR_ID = '26361333'; // Ladon
      const LANGUAGE_PARAM = '?language=fr';

      const categories = [
        { key: 'achievements', label: 'Achievements', apiPath: 'achievements' },
        { key: 'mounts', label: 'Montures', apiPath: 'mounts' },
        { key: 'bardings', label: 'Barde', apiPath: 'bardings' },
        { key: 'hairstyles', label: 'Coupe de cheveux', apiPath: 'hairstyles' },
        { key: 'fashions', label: 'Accessoires', apiPath: 'fashions' },
        { key: 'emotes', label: 'Emotes', apiPath: 'emotes' },
        { key: 'facewear', label: 'Accessoires 2', apiPath: 'facewear' },
        { key: 'orchestrions', label: 'Orchestrions', apiPath: 'orchestrions' },
        { key: 'minions', label: 'Mascottes', apiPath: 'minions' },
        { key: 'outfits', label: 'Ensemble', apiPath: 'outfits' },
        { key: 'armoires', label: 'Bahut', apiPath: 'armoires' },
        { key: 'triad/cards', label: 'Cartes', apiPath: 'triad/cards' },
        { key: 'frames', label: 'Portraits', apiPath: 'frames' }
      ];

      const container = document.getElementById('categories');

      const SVG_YES = '<span class="status-yes">Oui</span>';
      const SVG_NO = '<span class="status-no">Non</span>';
      const SVG_UNK = '<span class="status-unk">Inconnu</span>';

      async function fetchList(apiPath){
        const url = 'https://ffxivcollect.com/api/' + apiPath + LANGUAGE_PARAM;
        const res = await fetch(url);
        if (!res.ok) throw new Error(apiPath + ' -> HTTP ' + res.status);
        return await res.json();
      }

      async function fetchOwned(apiPath){
        // Attempt characters/{id}/{apiPath}/owned
        const url = 'https://ffxivcollect.com/api/characters/' + encodeURIComponent(CHAR_ID) + '/' + apiPath + '/owned';
        try{
          const res = await fetch(url);
          if (!res.ok) throw new Error('owned ' + apiPath + ' -> HTTP ' + res.status);
          const data = await res.json();
          if (!Array.isArray(data)) return null;
          // data may be array of ids or array of objects with id
          return new Set(data.map(item => String(item && (item.id || item) )));
        }catch(e){
          console.warn('Owned check failed for', apiPath, e);
          return null;
        }
      }

      function extractSourcesText(item){
        if (!item) return '';
        const s = item.sources || item.source || item.sources_text || item.source_text;
        if (!s) return '';
        if (Array.isArray(s)){
          // elements may be strings or objects with text
          return s.map(x => (typeof x === 'string' ? x : (x && (x.text || x.name || '')) )).filter(Boolean).join(' • ');
        }
        if (typeof s === 'string') return s;
        if (typeof s === 'object') return String(s.text || s.name || '');
        return '';
      }

      function createTableFor(category, items, ownedSet){
        const section = document.createElement('section');
        section.className = 'category';
        section.setAttribute('data-api-path', category.apiPath);
        
        const title = document.createElement('h2');
        const totalItems = items.length;
        const ownedCount = ownedSet ? items.filter(it => {
          const id = String(it.id || it.item_id || it.card_id || it.frame_id || it.minion_id || it.achievement_id || (it.uuid || ''));
          return ownedSet.has(id);
        }).length : 0;
        
        let progressText = '';
        if (ownedCount === totalItems && totalItems > 0) {
          progressText = 'Terminé';
        } else {
          progressText = ownedCount + ' / ' + totalItems;
        }
        
        title.innerHTML = category.label + ' (<span class="progress-text' + (ownedCount === totalItems && totalItems > 0 ? ' complete' : '') + '">' + progressText + '</span>)';
        section.appendChild(title);

        const table = document.createElement('table');
        const thead = document.createElement('thead');

        const showDescription = category.apiPath === 'achievements';
        const hideSourcesForAchievements = category.apiPath === 'achievements';

        // Build header
        let headerHtml = '<tr><th>Nom</th><th>Image</th>';
        if (showDescription) headerHtml += '<th>Description</th>';
        if (!hideSourcesForAchievements) headerHtml += '<th>Sources</th>';
        headerHtml += '<th>Possédé</th></tr>';
        thead.innerHTML = headerHtml;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        for (const it of items){
          const id = String(it.id || it.item_id || it.card_id || it.frame_id || it.minion_id || it.achievement_id || (it.uuid || ''));
          const tr = document.createElement('tr');
          const isOwned = ownedSet && ownedSet.has(id);
          tr.setAttribute('data-owned', isOwned ? 'true' : 'false');

          const tdName = document.createElement('td');
          tdName.textContent = it.name || it.title || '';
          tr.appendChild(tdName);

          const tdImg = document.createElement('td');
          tdImg.className = 'image-cell';
          const imgSrc = it.image || it.image_url || it.icon || '';
          if (imgSrc){
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = it.name || '';
            img.loading = 'lazy';
            tdImg.appendChild(img);
          } else {
            tdImg.textContent = '';
          }
          tr.appendChild(tdImg);

          if (showDescription){
            const tdDesc = document.createElement('td');
            const desc = it.description || it.summary || it.tooltip || it.excerpt || '';
            tdDesc.className = 'description';
            tdDesc.textContent = desc;
            tr.appendChild(tdDesc);
          }

          if (!hideSourcesForAchievements){
            const tdSources = document.createElement('td');
            tdSources.className = 'sources';
            const sourcesText = extractSourcesText(it);
            tdSources.textContent = sourcesText || '';
            tr.appendChild(tdSources);
          }

          const tdOwned = document.createElement('td');
          if (ownedSet === null){
            tdOwned.innerHTML = SVG_UNK;
          } else {
            if (ownedSet.has(id)) tdOwned.innerHTML = SVG_YES; else tdOwned.innerHTML = SVG_NO;
          }
          tr.appendChild(tdOwned);

          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        section.appendChild(table);

        return section;
      }

      async function buildAll(){
        // 1) Fetch all lists in parallel
        const listPromises = categories.map(cat => fetchList(cat.apiPath).then(data=>({ok:true,cat,data})).catch(e=>({ok:false,cat,e})));
        const lists = await Promise.all(listPromises);

        // 2) For each category, filter by patch === '7.56' (or startsWith '7.56')
        const toDisplay = [];

        for (const res of lists){
          if (!res.ok){
            console.warn('Failed to fetch', res.cat.apiPath, res.e);
            continue;
          }
          let items = res.data;
          if (!Array.isArray(items)){
            // Some endpoints may wrap results in an object; try to find array
            const maybe = Object.values(items).find(v=>Array.isArray(v));
            if (maybe) items = maybe; else items = [];
          }

          // filter by patch
          const filtered = items.filter(it => {
            if (!it) return false;
            if (!it.patch && !it.patch_id && !it.patch_number) return false;
            const p = String(it.patch || it.patch_number || it.patch_id || '');
            return p === '7.56' || p.startsWith('7.56');
          });

          if (filtered.length > 0){
            toDisplay.push({ cat: res.cat, items: filtered });
          }
        }

        if (toDisplay.length === 0){
          container.innerHTML = '<p class="muted">Aucun objet trouvé pour le patch 7.56.</p>';
          return;
        }

        // 3) For each category to display, attempt owned check (in parallel)
        const ownedPromises = toDisplay.map(entry => fetchOwned(entry.cat.apiPath).then(set=>({cat:entry.cat,set})).catch(e=>({cat:entry.cat,set:null})));
        const ownedResults = await Promise.all(ownedPromises);
        const ownedMap = new Map(ownedResults.map(r=>[r.cat.apiPath, r.set]));

        // 4) Render
        container.innerHTML = '';
        for (const entry of toDisplay){
          const set = ownedMap.get(entry.cat.apiPath) ?? null;
          const section = createTableFor(entry.cat, entry.items, set);
          container.appendChild(section);
        }

        // 5) Setup filter controls
        setupFilterControls();
      }

      function setupFilterControls(){
        const filterToggle = document.getElementById('owned-filter');
        
        filterToggle.addEventListener('change', applyFilter);
      }

      function applyFilter(){
        const filterToggle = document.getElementById('owned-filter');
        const hideOwned = filterToggle.checked;
        const sections = document.querySelectorAll('.category');

        sections.forEach(section => {
          const tbody = section.querySelector('tbody');
          if (!tbody) return;

          const rows = tbody.querySelectorAll('tr');
          let visibleCount = 0;

          rows.forEach(row => {
            if (hideOwned){
              const isOwned = row.getAttribute('data-owned') === 'true';
              if (isOwned){
                row.classList.add('hidden');
              } else {
                row.classList.remove('hidden');
                visibleCount++;
              }
            } else {
              row.classList.remove('hidden');
              visibleCount++;
            }
          });

          // Hide section if no visible rows
          if (visibleCount === 0){
            section.classList.add('hidden');
          } else {
            section.classList.remove('hidden');
          }
        });
      }

      // Start building on load
      document.addEventListener('DOMContentLoaded', buildAll);

    })();
  </script>
</body>
</html>
